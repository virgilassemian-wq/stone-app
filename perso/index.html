<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="4;url=https://stonesuite.github.io/">
<title>STONE a déménagé</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1526;
    color:#e8edf6;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .gem{font-size:44px;color:#c9a567}
  h1{font-size:24px;margin:14px 0 6px}
  p{color:#8b96ad;max-width:30em;line-height:1.6;margin:.4em auto}
  a.btn{display:inline-block;margin-top:18px;background:#c9a567;color:#161206;font-weight:800;
    padding:12px 26px;border-radius:12px;text-decoration:none}
</style>
</head>
<body>
<div>
  <div class="gem">◈</div>
  <h1>STONE a une nouvelle adresse</h1>
  <p>L'application vit désormais sur <b>stonesuite.github.io</b>.
     Installez-la depuis la nouvelle adresse&nbsp;: vos données ne sont pas perdues,
     elles vous attendent dans votre espace privé.</p>
  <a class="btn" href="https://stonesuite.github.io/">Ouvrir la nouvelle adresse</a>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    });
  }
</script>
</body>
</html>
